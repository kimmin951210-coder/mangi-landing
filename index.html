<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>승부사 만기 라이브</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    .wrapper img {
      display: block;
      width: calc(100% + 2px);
      max-width: none;
      height: auto;
      margin-left: -1px;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 7.0%;
      width: 85.5%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 생방송 보러가기 */
    .zone1 {
      top: 55.8%;
      height: 8.2%;
    }

    /* 2. 지난 방송 다시보기 */
    .zone2 {
      top: 64.6%;
      height: 8.2%;
    }

    /* 3. 오늘의 방송 일정 */
    .zone3 {
      top: 73.4%;
      height: 8.2%;
    }

    /* 4. 커뮤니티 문의 */
    .zone4 {
      top: 82.3%;
      height: 8.2%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <img
      src="./landing.png"
      alt="승부사 만기 라이브 안내 페이지"
    />

    <!-- 1. 생방송 보러가기 -->
    <a
      class="click-zone zone1"
      href="https://xn--or3b21d71b.tv/%EC%8A%B9%EB%B6%80%EC%82%AC%EB%A7%8C%EA%B8%B0%EB%84%A4"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="생방송 보러가기">
    </a>

    <!-- 2. 지난 방송 다시보기 -->
    <a
      class="click-zone zone2"
      href="https://www.youtube.com/@kn1677"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지난 방송 다시보기">
    </a>

    <!-- 3. 오늘의 방송 일정 -->
    <a
      class="click-zone zone3"
      href="https://open.kakao.com/o/s266v8Ag"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오늘의 방송 일정">
    </a>

    <!-- 4. 커뮤니티 문의 -->
    <a
      class="click-zone zone4"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="커뮤니티 문의">
    </a>

  </div>

</body>
</html>
